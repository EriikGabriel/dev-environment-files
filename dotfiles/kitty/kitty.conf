# ===================================================
# Kitty Configuration
# ===================================================

# Aparência
font_family JetBrains Mono
font_size 11

background_opacity 0.9


# ===================================================
# Tabs
# ===================================================

tab_bar_edge bottom
tab_bar_style powerline
tab_bar_min_tabs 1

# ===================================================
# Leader Key (ALT+Q)
#
# Kitty não possui leader key nativo como o WezTerm/tmux.
# Então usamos o modo "kitten keybindings".
# ===================================================

map alt+>c new_tab
map alt+q>x close_window
map alt+q>b previous_tab
map alt+q>n next_tab

map alt+q>0 goto_tab 0
map alt+q>1 goto_tab 1
map alt+q>2 goto_tab 2
map alt+q>3 goto_tab 3
map alt+q>4 goto_tab 4
map alt+q>5 goto_tab 5
map alt+q>6 goto_tab 6
map alt+q>7 goto_tab 7
map alt+q>8 goto_tab 8
map alt+q>9 goto_tab 9

# ===================================================
# Splits
# ===================================================

# Horizontal (lado a lado)
map alt+q>backslash launch --location=vsplit

# Vertical (cima/baixo)
map alt+q>minus launch --location=hsplit

# ===================================================
# Navegação entre panes
# ===================================================

map alt+q>left neighboring_window left
map alt+q>right neighboring_window right
map alt+q>up neighboring_window up
map alt+q>down neighboring_window down

# ===================================================
# Bordas
# ===================================================
# active_border_color #506477
# inactive_border_color #506477

window_border_width 1
draw_minimal_borders yes
window_padding_width 15


# BEGIN_KITTY_THEME
# Noctalia
include current-theme.conf
# END_KITTY_THEME
