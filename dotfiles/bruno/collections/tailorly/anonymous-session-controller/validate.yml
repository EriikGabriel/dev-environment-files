    description: OK
    request:
      url: "{{baseUrl}}/v1/anonymous-sessions/validate"
      method: POST
      body:
        type: json
        data: |-
          {
            "tokenHash": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "valid": false,
            "ownerId": "",
            "expiresAt": ""
          }
