info:
  name: validate
  type: http
  seq: 2
  tags:
    - anonymous-session-controller

http:
  method: POST
  url: "{{baseUrl}}/v1/anonymous-sessions/validate"
  body:
    type: json
    data: |-
      {
        "tokenHash": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
