info:
  name: create
  type: http
  seq: 1
  tags:
    - anonymous-session-controller

http:
  method: POST
  url: "{{baseUrl}}/v1/anonymous-sessions"
  body:
    type: json
    data: |-
      {
        "ownerId": "",
        "tokenHash": "",
        "expiresAt": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    description: Created
    request:
      url: "{{baseUrl}}/v1/anonymous-sessions"
      method: POST
      body:
        type: json
        data: |-
          {
            "ownerId": "",
            "tokenHash": "",
            "expiresAt": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": "",
            "ownerId": "",
            "expiresAt": "",
            "revokedAt": "",
            "valid": false
          }
