info:
  name: baseVersionCreate
  type: http
  seq: 1
  tags:
    - BaseVersion

http:
  method: POST
  url: "{{baseUrl}}/v1/base-versions"
  body:
    type: json
    data: |-
      {
        "documentId": "",
        "ownerId": "",
        "status": "",
        "versionNumber": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
