      method: POST
      body:
        type: json
        data: |-
          {
            "documentId": "",
            "ownerId": "",
            "status": "",
            "versionNumber": 0
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "createdAt": "",
            "documentId": "",
            "id": "",
            "ownerId": "",
            "reviewRevision": 0,
            "status": "",
            "versionNumber": 0
          }
